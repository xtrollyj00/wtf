# A fix task on ndk-fpga's AXIS head trimmer (CESNET, BSD-3-Clause): it drops the first
# TRIM_LENGTH bytes of each packet. The bug: when the trim ends exactly on a 64-byte word
# boundary, the last trimmed word is let through (`<` for `<=` in trim_pos_next_ok), so the packet
# comes out 64 bytes too long. The visible test meets it at packet #138 (trim 1152, 17.25us);
# the bad packet's first beat leaves TX at 17200ns.
upstream = "https://github.com/CESNET/ndk-fpga.git"
commit = "aac31e7771740a5ea6cc3ee2623a1318dd579fd0"
prompt = """
rtl/axis_head_trimmer.vhd is an AXI4-Stream head trimmer: it drops the first RX_AXI_TRIM_LENGTH
bytes of each packet. Its verification fails: `make sim` runs the cocotb test (tb/test_trim.py,
on nvc) and writes sim.log and trace.fst, the waveform of the run; both are there from the failing run. The environment is set up:
`make sim` runs as it is, in about 10 s. Find the cause in the RTL and fix it, so that `make sim`
passes. Don't change the testbench or the Makefile.
"""
answer = '{"signal": "<the signal whose logic was wrong>", "first_bad_time": "<the first wrong beat of the failing packet on TX: the rising edge that starts the cycle in which TVALID and TREADY are high for it, one clock before the edge that samples them, in ns>"}'
expect = '{"signal": "trim_pos_next_ok", "first_bad_time": "17200ns"}'

[files]
"rtl/axis_head_trimmer.vhd" = "comp/axis_tools/edit/head_trimmer/axis_head_trimmer.vhd"
