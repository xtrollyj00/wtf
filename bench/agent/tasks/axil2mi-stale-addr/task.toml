# A fix task on ndk-fpga's AXI4-Lite to MI converter (CESNET, BSD-3-Clause), one access at a time:
# an AXI read or write becomes one MI request. The bug samples the write address in ST_WRITE, with
# the data, instead of on the AW handshake: once AWREADY has gone, the master may already show its
# next write's address. So a write queued behind another (here: the second word of an 8-byte
# access) sends the one before it to the next word. 19 of 222 writes go one word up, the first at
# 84ns (AXI 0x80 to MI 0x84); most are overwritten later. The visible test checks only the
# read-back at the end: 4 registers wrong at 12.87us, 0x24 first, whose last write went to MI at
# 0x28 at 9252ns. The test never says when a register was written; the hidden run checks every
# MI request against its AXI one.
upstream = "https://github.com/CESNET/ndk-fpga.git"
commit = "aac31e7771740a5ea6cc3ee2623a1318dd579fd0"
prompt = """
rtl/axi4lite2mi.vhd converts AXI4-Lite to the MI bus, the simple register bus of the design it
sits in: each AXI read or write becomes one MI request. Its verification fails: `make sim` runs
the cocotb test (tb/test_regs.py, on nvc) and writes sim.log and trace.fst, the waveform of the
run; both are there from the failing run. The environment is set up: `make sim` runs as it is, in
about 5 s. Find the cause in the RTL and fix it, so that `make sim` passes. Don't change the
testbench or the Makefile.
"""
answer = '{"signal": "<the signal whose logic was wrong>", "first_bad_time": "<the first MI write that went to a wrong address: the rising edge that starts the cycle in which MI_WR and MI_ARDY are high for it, one clock before the edge that samples them, in ns>", "reg24_time": "<the same, for the write meant for register 0x24 that went elsewhere, in ns>"}'
expect = '{"signal": "reg_waddr_we", "first_bad_time": "84ns", "reg24_time": "9252ns"}'

[files]
"rtl/axi4lite2mi.vhd" = "comp/mi_tools/converters/axi4lite2mi/axi4lite2mi.vhd"
