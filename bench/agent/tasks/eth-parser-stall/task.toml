# A fix task on ndk-fpga's AXIS Ethernet header parser (CESNET, BSD-3-Clause): five pipeline
# stages (ETH, VLAN, IPv4, TCP, UDP) extract headers into FIFOs, read out on HEADERS; a counter of
# packets in flight backpressures RX before the FIFOs overflow. The bug: a packet's first word
# and a header read in the same cycle count +1 instead of 0, so the counter drifts up. The visible
# test meets it five times (the first at 95790ns); from 391270ns the counter is 6 with every FIFO
# empty, backpressure holds RX for good (the last RX beat is in the cycle from 391265ns, taken at
# 391270ns), and the test stops at 775/1500 packets.
upstream = "https://github.com/CESNET/ndk-fpga.git"
commit = "aac31e7771740a5ea6cc3ee2623a1318dd579fd0"
prompt = """
rtl/axis_eth_parser.vhd is the top of an AXI4-Stream Ethernet header parser: it passes frames
through from RX to TX and outputs each frame's extracted headers on HEADERS. Its verification
fails: `make sim` runs the cocotb test (tb/test_parser.py, on nvc) and writes sim.log and
trace.fst, the waveform of the run; both are there from the failing run. The environment is set up: `make sim` runs as it is, in
about 20 s. Find the cause in the RTL and fix it, so that `make sim` passes. Don't change the
testbench or the Makefile.
"""
answer = '{"signal": "<the signal whose logic was wrong>", "miscounts": <how many times in the failing run its logic went wrong (not how many cycles it held a wrong value)>, "stuck_from": "<the last RX handshake before the parser stopped taking data for good: the rising edge that starts the cycle in which RX TVALID and TREADY are high for it, one clock before the edge that samples them, in ns>"}'
expect = '{"signal": "packets_in_flight", "miscounts": 5, "stuck_from": "391265ns"}'

[files]
"rtl/axis_eth_parser.vhd" = "comp/axis_tools/logic/eth_parser/axis_eth_parser.vhd"
