# A fix task on ndk-fpga's AXIS Ethernet header parser (CESNET, BSD-3-Clause), with the parser
# and the whole base library in rtl/comp/. The bug is a handshake slip in a subcomponent:
# AXIS_ETH_PARSER_SNIFFER (one in each of the five stages) sizes a word's chunk of the header
# when RX_AXI_TVALID is high, not on the handshake (valid_word). When TX stalls on the word
# holding a header's last bytes, the sniffer counts the extraction complete before the bytes are
# latched, and the header leaves with stale bytes of the packet before. The visible test has
# light TX backpressure (ready low ~2%), so it takes a few packets: in the UDP stage the stalled
# cycle is at 2270ns, and the stale UDP header (packet 9, every field wrong) goes valid on
# HEADERS at 2290ns. The hidden run's heavy backpressure fails at once.
upstream = "https://github.com/CESNET/ndk-fpga.git"
commit = "aac31e7771740a5ea6cc3ee2623a1318dd579fd0"
prompt = """
rtl/comp/axis_tools/logic/eth_parser/ is an AXI4-Stream Ethernet header parser (its top is
axis_eth_parser.vhd); rtl/comp/base/ is the library of components it is built from. The parser
passes frames through from RX to TX and outputs each frame's extracted headers on HEADERS. Its
verification fails: `make sim` runs the cocotb test (tb/test_parser.py, on nvc) and writes
sim.log and trace.fst, the waveform of the run; both are there from the failing run. The environment is set up: `make sim` runs as
it is, in about 20 s. Find the cause in the RTL and fix it, so that `make sim` passes. Don't
change the testbench or the Makefile.
"""
answer = '{"entity": "<the entity whose code was wrong>", "first_bad_time": "<when HEADERS_VLD rose for the first wrong header, in ns>", "stall_time": "<the clock cycle in which the wrong header was made: the rising edge that starts it, in ns>"}'
expect = '{"entity": "AXIS_ETH_PARSER_SNIFFER", "first_bad_time": "2290ns", "stall_time": "2270ns"}'

[files]
"rtl/comp/base" = "comp/base"
"rtl/comp/axis_tools/logic/eth_parser" = "comp/axis_tools/logic/eth_parser"
