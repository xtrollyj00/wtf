[package]
name = "wtf-wave"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# the package is wtf-wave (wtf is taken on crates.io); the command is wtf
[[bin]]
name = "wtf"
path = "src/main.rs"

[workspace]
members = ["core", "bench"]
# so `cargo test`, `cargo clippy` and `cargo build` cover the core too
default-members = [".", "core"]

[dependencies]
wtf-core = { path = "core" }
libc = "0.2"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
nucleo-matcher = "0.3"
ratatui = "0.30"
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["rt", "macros", "io-std"] }
toml = "1.1.8"

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.154"
