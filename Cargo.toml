[package]
name = "wtf-wave"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Vim-like terminal viewer for VCD, FST and GHW waveforms, with an MCP server for AI agents"
repository = "https://github.com/xtrollyj00/wtf"
readme = "README.md"
keywords = ["waveform", "vcd", "fst", "tui", "mcp"]
categories = ["command-line-utilities", "development-tools::debugging", "simulation"]
# what `cargo install wtf-wave` builds from; the tests and their fixtures stay in the repository
include = ["/src/**/*", "/themes/*.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

# the package is wtf-wave (wtf is taken on crates.io); the command is wtf
[[bin]]
name = "wtf"
path = "src/main.rs"

[workspace]
members = ["core", "bench"]
# so `cargo test`, `cargo clippy` and `cargo build` cover the core too
default-members = [".", "core"]

[dependencies]
wtf-core = { path = "core", version = "0.4.0" }
# the status line's local clock, on every OS (libc's localtime_r is Unix only)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
nucleo-matcher = "0.3"
regex = "1.13.1"
ratatui = "0.30"
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.0", features = ["rt", "macros", "io-std"] }
toml = "1.1.8"
terminal-colorsaurus = "1.0.3"

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.154"
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# AF_UNIX sockets for the link on Windows 10 1803+ (spec §15 "Registry", §18)
[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"

# tests/terminal.rs: a pseudo-terminal, Unix only
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
