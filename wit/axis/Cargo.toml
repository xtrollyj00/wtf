[package]
name = "wtf-axis"
version = "0.1.0"
edition = "2024"
description = "AXI4-Stream as a component: the bench's Rust and WASM decode (spec §16)"
publish = false

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "wtf:axis"

[package.metadata.component.target]
path = "../protocol.wit"

# a component is loaded into a window: small, and no debug info to carry
[profile.release]
opt-level = "s"
strip = true

[workspace]
