[package]
name = "wtf-probe"
version = "0.1.0"
edition = "2024"
description = "The example protocol `tests/data/wasm/probe.wasm` holds (spec §16)"
publish = false

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "wtf:probe"

[package.metadata.component.target]
path = "../protocol.wit"

# a component is loaded into a window: small, and no debug info to carry
[profile.release]
opt-level = "s"
strip = true

[workspace]
