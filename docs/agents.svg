<text x="20" y="32" font-size="17" font-weight="600" fill="#0b0b0b">An agent fixing failing RTL testbenches, with and without wtf</text>
<text x="20" y="54" font-size="13" fill="#52514e">Every run fixed its bug either way; with wtf, 16 of 20 had every answer right (9 without), sooner and cheaper.</text>
