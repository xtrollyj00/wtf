<title id="t">Haiku fixing three failing RTL testbenches, with and without wtf</title>
<desc id="d">eth-parser-headers: with wtf 5 of 5 right, 116 s, $0.029; without 3 of 5, 205 s, $0.048; eth-parser-stall: with wtf 3 of 5 right, 77 s, $0.014; without 4 of 5, 127 s, $0.018; head-trimmer-boundary: with wtf 4 of 5 right, 80 s, $0.014; without 0 of 5, 138 s, $0.023; axil2mi-stale-addr: with wtf 4 of 5 right, 44 s, $0.013; without 2 of 5, 115 s, $0.026</desc>
