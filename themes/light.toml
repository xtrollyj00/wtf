# Light: its own background and text over the terminal's.
# A colour is "#rrggbb", a 256-colour index, ["#rrggbb", index] (its shade on terminals
# without truecolor; otherwise the nearest) or "default" (the terminal's own). Keys left out
# are dark's. spec §19.

line        = ["#0e7490", 30]   # 1-bit lines and bus outlines
fill        = ["#9fd3da", 152]  # 1-bit signals toggling faster than a column
unknown     = ["#c62828", 160]  # X
highz       = ["#2e7d32", 28]   # Z
cursor      = ["#c18401", 136]  # the accent: the cursor's time, the selected name, EDIT
cursor_text = ["#fafafa", 231]  # text on the accent
column      = ["#f3e2b3", 223]  # behind the cursor's column
cursor_dim  = ["#f5efdf", 255]  # behind the marks' columns
selected    = ["#e4e8ee", 254]  # behind the selected row
hatch       = ["#8a8f98", 245]  # busy bus columns
dim         = ["#7a808a", 244]  # scopes, time labels, headings
grid        = ["#e4e8ee", 254]  # grid lines
background  = ["#fafafa", 231]  # the screen; "default" keeps the terminal's
text        = ["#383a42", 237]  # text; "default" keeps the terminal's

# the shades of the signal colours (:color)
red         = ["#c62828", 160]
orange      = ["#c2581c", 166]
yellow      = ["#a67c00", 136]
green       = ["#2e7d32", 28]
cyan        = ["#0e7490", 30]
blue        = ["#1d4ed8", 26]
magenta     = ["#a21caf", 127]
gray        = ["#6b7280", 243]
