# Dark: the terminal's own background and text, One Dark's shades.
# A colour is "#rrggbb", a 256-colour index, ["#rrggbb", index] (its shade on terminals
# without truecolor; otherwise the nearest) or "default" (the terminal's own). Keys left out
# are dark's. spec §19.

line        = ["#56b6c2", 73]   # 1-bit lines
bus         = ["#9d8cff", 141]  # bus and stream outlines (their labels are in the text colour)
fill        = ["#2e6b73", 30]   # 1-bit signals toggling faster than a column
unknown     = ["#e06c75", 168]  # X
highz       = ["#98c379", 114]  # Z
cursor      = ["#e5c07b", 180]  # the accent: the cursor's time, the selected name, EDIT
cursor_text = ["#1e1e1e", 234]  # text on the accent
column      = ["#5c4f2c", 58]   # behind the cursor's column
cursor_dim  = ["#383b40", 237]  # behind the marks' columns, fainter and neutral
selected    = ["#2c313c", 236]  # behind the selected row
panel       = ["#282c34", 235]  # behind the signal panel, help and completions
hatch       = ["#7f848e", 245]  # busy bus columns
dim         = ["#5c6370", 241]  # scopes, time labels, headings
background  = "default"         # the screen; "default" keeps the terminal's
text        = "default"         # text; "default" keeps the terminal's

# the shades of the signal colours (:color)
red         = ["#ff6b6b", 203]
orange      = ["#d19a66", 173]
yellow      = ["#e5c07b", 180]
green       = ["#98c379", 114]
cyan        = ["#56b6c2", 73]
blue        = ["#61afef", 75]
magenta     = ["#c678dd", 176]
gray        = ["#abb2bf", 249]
