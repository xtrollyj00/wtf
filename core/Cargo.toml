[package]
name = "wtf-core"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xtrollyj00/wtf"
description = "wtf's core: traces, rows, cursors, sessions, the `:` commands and searches, with no user interface"

[dependencies]
toml = { version = "1.1.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
wellen = "0.25"
regex = "1.13.1"
dashu-int = "0.6.2"
# the MCP tool schema derives the session model; keep this on rmcp's re-export's version
schemars = { version = "1", features = ["derive"], optional = true }

[features]
schema = ["dep:schemars"]
